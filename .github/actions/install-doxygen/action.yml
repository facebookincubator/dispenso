name: Install Doxygen
description: >
  Install the pinned Doxygen build used for every documentation build. Both the
  CI job that validates the docs and the job that publishes the site use this,
  so the version we test is the version we ship.

runs:
  using: composite
  steps:
    - name: Install and verify Doxygen
      shell: bash
      run: |
        set -euo pipefail

        # Doxygen 1.9.2 through 1.9.8 fail to resolve a markdown link to a page
        # carrying an explicit {#label}, which every cross-page link here relies
        # on. 1.11.0 is the oldest release verified free of that bug, so it is
        # the supported floor. The runner's apt doxygen is older than this and
        # floats with the image, so install an explicit build rather than
        # trusting apt.
        DOXYGEN_MIN_VERSION="1.11.0"
        DOXYGEN_VERSION="1.11.0"
        # SHA-256 of doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz. The archive is
        # fetched over the network and installed onto PATH, so it is verified
        # before it is unpacked. Re-pin whenever DOXYGEN_VERSION changes:
        #   curl -fsSL <url below> | sha256sum
        DOXYGEN_SHA256="db68ca22b43c3d7efd15351329db5af9146ab1ac7eaccd61a894fe36612da8fb"

        sudo apt-get update && sudo apt-get install -y graphviz
        curl -fsSL -o doxygen.tar.gz \
          "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        echo "${DOXYGEN_SHA256}  doxygen.tar.gz" | sha256sum -c -
        tar xzf doxygen.tar.gz
        sudo install "doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
        rm -rf doxygen.tar.gz "doxygen-${DOXYGEN_VERSION}"

        have=$(doxygen --version | cut -d' ' -f1)
        oldest=$(printf '%s\n%s\n' "$DOXYGEN_MIN_VERSION" "$have" | sort -V | head -n1)
        if [ "$oldest" != "$DOXYGEN_MIN_VERSION" ]; then
          echo "doxygen $have is older than the required minimum $DOXYGEN_MIN_VERSION"
          exit 1
        fi
        echo "doxygen $have satisfies minimum $DOXYGEN_MIN_VERSION"
