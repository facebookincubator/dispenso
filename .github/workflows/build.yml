name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  #############################################################################
  # Core platform builds - strategic sampling of OS/compiler/standard/library
  #############################################################################
  build-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC baseline
          - name: Linux GCC C++14
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_STANDARD=14
          # Linux - Clang with C++20 concepts
          - name: Linux Clang C++20
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cmake_args: -DCMAKE_CXX_STANDARD=20
          # macOS - C++20 with static library
          - name: macOS C++20 static
            os: macos-latest
            cmake_args: -DCMAKE_CXX_STANDARD=20 -DDISPENSO_SHARED_LIB=OFF
          # Windows - MSVC baseline
          - name: Windows MSVC C++14
            os: windows-latest
            cmake_args: -DCMAKE_CXX_STANDARD=14
          # Windows - MSVC C++20 with static library
          - name: Windows MSVC C++20 static
            os: windows-latest
            cmake_args: -DCMAKE_CXX_STANDARD=20 -DDISPENSO_SHARED_LIB=OFF
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4 --config Release
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky --build-config Release

  #############################################################################
  # Architecture-specific builds
  #############################################################################
  build-linux-x86:
    name: Linux x86 (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install 32-bit support
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32"
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  build-macos-gcc:
    name: macOS GCC C++14 (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up GCC
        run: |
          brew list gcc || brew install gcc
          GCC_PREFIX=$(brew --prefix gcc)
          GCC_VER=$(ls "$GCC_PREFIX/bin"/gcc-* | grep -oE '[0-9]+$' | sort -n | tail -1)
          echo "CC=$GCC_PREFIX/bin/gcc-$GCC_VER" >> $GITHUB_ENV
          echo "CXX=$GCC_PREFIX/bin/g++-$GCC_VER" >> $GITHUB_ENV
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=14
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  build-windows-x86:
    name: Windows x86 (32-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -A Win32 -DDISPENSO_BUILD_TESTS=ON
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4 --config Release
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky --build-config Release

  #############################################################################
  # Sanitizer builds - critical for concurrency library
  #############################################################################
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # TSan requires clang - GCC 13's TSan has spurious warnings about atomic_thread_fence
          - name: Thread Sanitizer
            cmake_args: -DTHREAD_SANITIZER=ON
            cc: clang
            cxx: clang++
          - name: Address Sanitizer
            cmake_args: -DADDRESS_SANITIZER=ON
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  #############################################################################
  # Documentation build
  #############################################################################
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      # Doxygen 1.9.2 through 1.9.8 fail to resolve a markdown link to a page
      # carrying an explicit {#label}, which every cross-page link here relies
      # on. 1.11.0 is the oldest release verified free of that bug, so it is the
      # supported floor. The runner's apt doxygen is older than this and floats
      # with the image, so install an explicit build rather than trusting apt.
      DOXYGEN_MIN_VERSION: "1.11.0"
      DOXYGEN_VERSION: "1.11.0"
      # SHA-256 of doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz. The archive is
      # fetched over the network and installed onto PATH, so it is verified
      # before it is unpacked. Re-pin whenever DOXYGEN_VERSION changes:
      #   curl -fsSL <url below> | sha256sum
      DOXYGEN_SHA256: "db68ca22b43c3d7efd15351329db5af9146ab1ac7eaccd61a894fe36612da8fb"
    steps:
      - uses: actions/checkout@v5
      - name: Install Doxygen
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          curl -fsSL -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  doxygen.tar.gz" | sha256sum -c -
          tar xzf doxygen.tar.gz
          sudo install "doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
      - name: Enforce minimum Doxygen version
        run: |
          have=$(doxygen --version | cut -d' ' -f1)
          oldest=$(printf '%s\n%s\n' "$DOXYGEN_MIN_VERSION" "$have" | sort -V | head -n1)
          if [ "$oldest" != "$DOXYGEN_MIN_VERSION" ]; then
            echo "doxygen $have is older than the required minimum $DOXYGEN_MIN_VERSION"
            exit 1
          fi
          echo "doxygen $have satisfies minimum $DOXYGEN_MIN_VERSION"
      - name: Build documentation
        working-directory: ./docs
        run: doxygen Doxyfile
      - name: Check for warnings
        working-directory: ./docs
        run: |
          if [ -s doxygen_warnings.log ]; then
            echo "Doxygen warnings found:"
            cat doxygen_warnings.log
            exit 1
          fi
          echo "No Doxygen warnings."

  #############################################################################
  # Code coverage
  #############################################################################
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Configure with coverage
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test (stable tests)
        working-directory: ./build
        run: ctest -LE flaky
      - name: Test (TimedTask, with retries)
        working-directory: ./build
        run: ctest -L flaky -R "^TimedTaskTest\." --repeat until-pass:5
      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov,negative
          lcov --remove coverage.info '/usr/*' '*/build/_deps/*' '*/tests/*' '*/third-party/*' '*/benchmarks/*' '*/examples/*' '*/bits/*' '*/ext/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
