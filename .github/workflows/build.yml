name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  #############################################################################
  # Core platform builds - strategic sampling of OS/compiler/standard/library
  #############################################################################
  build-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC baseline
          - name: Linux GCC C++14
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_STANDARD=14
          # Linux - Clang with C++20 concepts
          - name: Linux Clang C++20
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cmake_args: -DCMAKE_CXX_STANDARD=20
          # macOS - C++20 with static library
          - name: macOS C++20 static
            os: macos-latest
            cmake_args: -DCMAKE_CXX_STANDARD=20 -DDISPENSO_SHARED_LIB=OFF
          # Windows - MSVC baseline
          - name: Windows MSVC C++14
            os: windows-latest
            cmake_args: -DCMAKE_CXX_STANDARD=14
          # Windows - MSVC C++20 with static library
          - name: Windows MSVC C++20 static
            os: windows-latest
            cmake_args: -DCMAKE_CXX_STANDARD=20 -DDISPENSO_SHARED_LIB=OFF
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4 --config Release
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky --build-config Release

  #############################################################################
  # Architecture-specific builds
  #############################################################################
  build-linux-x86:
    name: Linux x86 (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install 32-bit support
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32"
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  build-linux-aarch64:
    name: Linux aarch64 ${{ matrix.compiler }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5
      # macOS covers arm64, but only through Apple's toolchain and its libc.
      # The aarch64 timestamp path reads cntvct_el0 directly and CpuSet's
      # topology probing is Linux-specific, so neither is exercised until
      # aarch64 is built against glibc.
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  build-macos-gcc:
    name: macOS GCC C++14 (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up GCC
        run: |
          brew list gcc || brew install gcc
          GCC_PREFIX=$(brew --prefix gcc)
          GCC_VER=$(ls "$GCC_PREFIX/bin"/gcc-* | grep -oE '[0-9]+$' | sort -n | tail -1)
          echo "CC=$GCC_PREFIX/bin/gcc-$GCC_VER" >> $GITHUB_ENV
          echo "CXX=$GCC_PREFIX/bin/g++-$GCC_VER" >> $GITHUB_ENV
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=14
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  build-windows-x86:
    name: Windows x86 (32-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -A Win32 -DDISPENSO_BUILD_TESTS=ON
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4 --config Release
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky --build-config Release

  #############################################################################
  # Cross-compiled architectures, executed under QEMU
  #############################################################################
  build-cross:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit ARM is the interesting one: pointers are 32-bit but
          # dispenso's atomics are not, so it is where a 64-bit atomic can turn
          # into a libatomic call that x86 never needed.
          - name: Linux armv7 (32-bit, QEMU)
            packages: g++-arm-linux-gnueabihf
            processor: arm
            triple: arm-linux-gnueabihf
            sysroot: /usr/arm-linux-gnueabihf
            qemu: qemu-arm-static
          # RISC-V has never been tested at all. Building and running is the
          # bar here; performance is not measurable under emulation.
          - name: Linux riscv64 (QEMU)
            packages: g++-riscv64-linux-gnu
            processor: riscv64
            triple: riscv64-linux-gnu
            sysroot: /usr/riscv64-linux-gnu
            qemu: qemu-riscv64-static
          # Ubuntu packages no rv32 Linux toolchain, so this one comes from
          # Bootlin. The checksum is what pins it: the URL fixes only which
          # path is fetched, so without verifying the bytes a re-rolled
          # artifact would be unpacked and run here with no commit in this
          # repo.
          - name: Linux riscv32 (QEMU)
            processor: riscv32
            triple: riscv32-buildroot-linux-gnu
            toolchain_url: https://toolchains.bootlin.com/downloads/releases/toolchains/riscv32-ilp32d/tarballs/riscv32-ilp32d--glibc--stable-2025.08-1.tar.xz
            toolchain_sha256: d42680e926542595c4c87629d33f5f90aac1e9a964c8955089e0514caa01b78f
            toolchain_dir: riscv32-ilp32d--glibc--stable-2025.08-1
            sysroot: /opt/cross/riscv32-ilp32d--glibc--stable-2025.08-1/riscv32-buildroot-linux-gnu/sysroot
            qemu: qemu-riscv32-static
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static ${{ matrix.packages }}
          if [ -n "${{ matrix.toolchain_url }}" ]; then
            curl -fsSL "${{ matrix.toolchain_url }}" -o /tmp/toolchain.tar.xz
            echo "${{ matrix.toolchain_sha256 }}  /tmp/toolchain.tar.xz" \
              | sha256sum -c -
            sudo mkdir -p /opt/cross
            sudo tar -xJf /tmp/toolchain.tar.xz -C /opt/cross
            echo "/opt/cross/${{ matrix.toolchain_dir }}/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -DCMAKE_C_COMPILER=${{ matrix.triple }}-gcc \
            -DCMAKE_CXX_COMPILER=${{ matrix.triple }}-g++ \
            -DCMAKE_FIND_ROOT_PATH=${{ matrix.sysroot }} \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/${{ matrix.qemu }}
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      # CMAKE_CROSSCOMPILING_EMULATOR makes ctest launch each test under QEMU;
      # QEMU_LD_PREFIX points its loader at the target sysroot.
      - name: Test
        working-directory: ./build
        env:
          QEMU_LD_PREFIX: ${{ matrix.sysroot }}
        run: ctest -LE flaky

  #############################################################################
  # Packaging configurations - what the package managers actually ship
  #############################################################################
  build-system-concurrentqueue:
    name: Linux system concurrentqueue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The vcpkg and conan ports both build with
      # DISPENSO_USE_SYSTEM_CONCURRENTQUEUE=ON, so this is the configuration
      # their users get, and nothing else here exercises it. Without this job a
      # break surfaces weeks later during a port round rather than on the pull
      # request that caused it -- which is how 1.6.1 shipped a find_package
      # version that no installed concurrentqueue can satisfy.
      - name: Install concurrentqueue
        run: |
          git clone --depth 1 --branch v1.0.5 \
            https://github.com/cameron314/concurrentqueue.git /tmp/concurrentqueue
          cmake -S /tmp/concurrentqueue -B /tmp/concurrentqueue/build \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/concurrentqueue/build
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DDISPENSO_USE_SYSTEM_CONCURRENTQUEUE=ON
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  #############################################################################
  # Bleeding-edge toolchains - advisory, never blocking
  #############################################################################
  build-clang-trunk:
    name: Linux Clang trunk (advisory)
    runs-on: ubuntu-latest
    # Trunk breaks for reasons that are usually LLVM's rather than ours, so a
    # failure here is a heads-up and must not gate a pull request. Read it
    # before a new Clang release, not during review.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang trunk
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          CODENAME=$(lsb_release -cs)
          # The unsuffixed llvm-toolchain-<codename> repo tracks the
          # development branch; the suffixed ones pin to a release.
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-trunk.list
          sudo apt-get update
          # Resolve the version rather than hardcoding it, so this keeps
          # working as trunk's major version advances.
          VER=$(apt-cache search --names-only '^clang-[0-9]+$' \
            | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "Installing clang-$VER"
          sudo apt-get install -y "clang-$VER"
          echo "CC=clang-$VER" >> $GITHUB_ENV
          echo "CXX=clang++-$VER" >> $GITHUB_ENV
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  # Neither runner image ships anything newer than GCC 13, so these two are the
  # only coverage of current compilers -- and the only jobs that build the
  # examples at all, which is what keeps examples/ from rotting unnoticed.
  # Blocking rather than advisory for exactly that reason: an example that stops
  # compiling should fail CI. Both versions are pinned, so neither can break
  # spontaneously under us.
  build-gcc-16:
    name: Linux GCC 16 + libstdc++
    runs-on: ubuntu-latest
    # Docker official image, so this is the compiler a user gets rather than
    # whatever the runner happens to ship.
    container: gcc:16.2
    steps:
      - uses: actions/checkout@v5
      - name: Install CMake
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DDISPENSO_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky
      - name: Compile as an external consumer
        run: |
          cmake --install build --prefix /tmp/prefix
          g++ -std=c++20 -O3 -pthread -Wall -Wextra \
            -I/tmp/prefix/include \
            examples/chunking_comparison_example.cpp \
            -L/tmp/prefix/lib -ldispenso -o /tmp/consumer
          LD_LIBRARY_PATH=/tmp/prefix/lib /tmp/consumer

  build-clang-22-libcxx:
    name: Linux Clang 22 + libc++
    runs-on: ubuntu-latest
    # libc++ rather than libstdc++ deliberately. Every other Linux job uses
    # libstdc++, and clang-trunk already covers clang against it, so pairing the
    # newest Clang with libc++ is the only configuration here that exercises a
    # second standard library -- different atomics, different containers.
    #
    # CMAKE_DISABLE_FIND_PACKAGE_GTest forces the FetchContent path in
    # tests/CMakeLists.txt. Its find_package(GTest) would otherwise pick up a
    # system GTest built against libstdc++, and linking that into a libc++ build
    # fails on ABI mismatch -- a failure about the runner, not about dispenso.
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang 22 and libc++
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          CODENAME=$(lsb_release -cs)
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libc++-22-dev libc++abi-22-dev
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DDISPENSO_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
        env:
          CC: clang-22
          CXX: clang++-22
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky
      - name: Compile as an external consumer
        run: |
          cmake --install build --prefix /tmp/prefix
          clang++-22 -stdlib=libc++ -std=c++20 -O3 -pthread -Wall -Wextra \
            -I/tmp/prefix/include \
            examples/chunking_comparison_example.cpp \
            -L/tmp/prefix/lib -ldispenso -o /tmp/consumer
          LD_LIBRARY_PATH=/tmp/prefix/lib /tmp/consumer

  #############################################################################
  # Sanitizer builds - critical for concurrency library
  #############################################################################
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # TSan requires clang - GCC 13's TSan has spurious warnings about atomic_thread_fence
          - name: Thread Sanitizer
            cmake_args: -DTHREAD_SANITIZER=ON
            cc: clang
            cxx: clang++
          - name: Address Sanitizer
            cmake_args: -DADDRESS_SANITIZER=ON
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test
        working-directory: ./build
        run: ctest -LE flaky

  #############################################################################
  # Documentation build
  #############################################################################
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Shared with docs.yml so the validated version and the published one
      # cannot drift apart; the pin lives in the action.
      - uses: ./.github/actions/install-doxygen
      - name: Build documentation
        working-directory: ./docs
        run: doxygen Doxyfile
      - name: Check for warnings
        working-directory: ./docs
        run: |
          if [ -s doxygen_warnings.log ]; then
            echo "Doxygen warnings found:"
            cat doxygen_warnings.log
            exit 1
          fi
          echo "No Doxygen warnings."

  #############################################################################
  # Code coverage
  #############################################################################
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Configure with coverage
        run: |
          mkdir build && cd build
          cmake .. -DDISPENSO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        working-directory: ./build
        run: cmake --build . --parallel 4
      - name: Test (stable tests)
        working-directory: ./build
        run: ctest -LE flaky
      - name: Test (TimedTask, with retries)
        working-directory: ./build
        run: ctest -L flaky -R "^TimedTaskTest\." --repeat until-pass:5
      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov,negative
          lcov --remove coverage.info '/usr/*' '*/build/_deps/*' '*/tests/*' '*/third-party/*' '*/benchmarks/*' '*/examples/*' '*/bits/*' '*/ext/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
