name: Docs

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set version from CHANGELOG
      run: |
        VERSION=$(grep -m1 '^[0-9]' CHANGELOG.md | sed 's/ .*//')
        sed -i "s/^PROJECT_NUMBER.*/PROJECT_NUMBER         = $VERSION/" docs/Doxyfile

    - uses: ./.github/actions/install-doxygen

    - name: Build documentation
      working-directory: ./docs
      run: doxygen Doxyfile

    # The published site is the one place a broken cross-page link actually
    # reaches readers, so it gets the same warning gate the validation job has.
    - name: Check for warnings
      working-directory: ./docs
      run: |
        if [ -s doxygen_warnings.log ]; then
          echo "Doxygen warnings found:"
          cat doxygen_warnings.log
          exit 1
        fi
        echo "No Doxygen warnings."

    - name: Copy benchmark dashboard
      run: cp -r docs/benchmarks docs/doxygen/html/benchmarks

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/doxygen/html
