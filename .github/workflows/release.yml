name: Release

# A published tag cannot be walked back: the package manager ports pin the
# SHA-256 of the tarball GitHub generates for it, so moving a tag invalidates
# hashes already recorded downstream. This job therefore validates the tagged
# tree before it publishes anything, and every check below is a hard failure.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $GITHUB_REF_NAME does not name an x.y.z version."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Require an annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A lightweight tag is a bare ref: no tagger, no date, no message, and
          # nothing to sign. Releases are cut from annotated tags only.
          #
          # Ask the API rather than the local repository. Whatever `refs/tags/`
          # entry the checkout leaves behind points at the commit, so
          # `git cat-file -t` answers "commit" for an annotated tag and the
          # check rejects a perfectly good release. v1.6.1 and v1.6.2 were both
          # annotated and signed, and both were rejected that way; adding
          # `fetch-tags` did not change it. The API reports the tag object
          # itself and cannot be confused by local ref layout.
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')
          echo "$GITHUB_REF_NAME is a '$TYPE' object."
          if [ "$TYPE" != "tag" ]; then
            echo "$GITHUB_REF_NAME is lightweight; use 'git tag -s' (or -a)."
            exit 1
          fi

          # Signature verification needs the tag object locally, which the
          # checkout may not have brought. Fetch it explicitly; a failure here
          # is not fatal, since the gate above has already run.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          if git verify-tag "$GITHUB_REF_NAME" 2>/dev/null; then
            echo "Tag signature verified."
          else
            echo "::warning::$GITHUB_REF_NAME is unsigned, or its public key is not available to the runner."
          fi

      - name: Verify every version reference agrees with the tag
        run: python3 scripts/release.py check --version "$VERSION"

      - name: Extract the changelog section
        run: |
          awk -v v="$VERSION" '
            BEGIN            { f = 0 }
            !f && index($0, v " (") == 1 { f = 1; next }
            f && /^[0-9]/    { exit }
            f                { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
          echo "Release notes:"; cat release_notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "dispenso $VERSION" \
            --notes-file release_notes.md \
            --latest
